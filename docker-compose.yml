name: what-the-song

services:
  web:
    build:
      context: .
      target: web
    image: what-the-song:local
    ports:
      - "${PORT:-3000}:80"
    volumes:
      # The clip library stays on the host. Add songs with tools/ingest.py and
      # reload the page — no image rebuild needed.
      - ./public/clips:/srv/clips:ro
    environment:
      # Leave both unset for a localhost-only game. Set them to put the site
      # behind basic auth before sharing the URL (see README).
      AUTH_USER: "${AUTH_USER:-}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:-}"
    restart: unless-stopped

  # Leaderboard backend. Not published on a host port: it is only reachable
  # through Caddy at /api/*, and so only behind the basic auth above.
  scores:
    build:
      context: .
      target: scores
    image: what-the-song-scores:local
    volumes:
      - scores:/data
    environment:
      # Weeks start Monday 00:00 and months on the 1st, at this UTC offset.
      SCORES_UTC_OFFSET: "${SCORES_UTC_OFFSET:-7}"
    restart: unless-stopped

volumes:
  scores:
