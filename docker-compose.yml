name: what-the-song

services:
  # Caddy: the static game, local/rollback clip library, and /api proxy.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        SITE_URL: "${SITE_URL:-}"
    image: what-the-song:local
    ports:
      - "127.0.0.1:${PORT:-3000}:80"
    volumes:
      # Keep the local library for default serving and COS rollback. With COS
      # enabled, publish from the laptop; the API signs private COS URLs.
      - ./apps/web/public/assets:/srv/assets:ro
    environment:
      # Optional site-wide gate, separate from player accounts. Leave both unset
      # for a localhost-only game; set them before sharing the URL (see README).
      AUTH_USER: "${AUTH_USER:-}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:-}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # NestJS: accounts and player records. Stateless — scale with
  # `docker compose up -d --scale api=3`; Caddy balances across replicas.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: what-the-song-api:local
    environment:
      DATABASE_URL: "postgres://wts:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/wts"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}"
      # Only Caddy can reach this container, so its forwarded headers are true.
      TRUST_PROXY: "true"
      # Set to true once the site is served over https.
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      # Leaderboard weeks start Monday 00:00 and months on the 1st, at this
      # many hours from UTC. 7 is Vietnam.
      LEADERBOARD_UTC_OFFSET: "${LEADERBOARD_UTC_OFFSET:-7}"
      # Optional private COS library. Set all four together on the VPS; uploader
      # COS_UPLOAD_* credentials stay on the laptop and never enter Compose.
      COS_BUCKET: "${COS_BUCKET:-}"
      COS_REGION: "${COS_REGION:-}"
      COS_SECRET_ID: "${COS_SECRET_ID:-}"
      COS_SECRET_KEY: "${COS_SECRET_KEY:-}"
    expose:
      - "4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wts
      POSTGRES_DB: wts
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wts -d wts"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  # Player accounts and records. Back it up — see README.
  pgdata:
